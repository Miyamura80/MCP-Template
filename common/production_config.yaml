example_parent:
  example_child: "prod_value"

# The public no-auth demo endpoint (/mcp-demo) is on in production so the
# landing page's "try it without signing up" flow works out of the box.
demo:
  enabled: true

# Overrides applied when DEV_ENV=prod. Replace the placeholder origin with the
# deployed dashboard / MCP host domain before going live.
server:
  host: "0.0.0.0"
  allowed_origins:
    - "https://YOUR-DASHBOARD-DOMAIN.example.com"
